- date: "21 August 2025"
  headline: "Our paper has been accepted at EMNLP 2025 in the main track! 🎉🎉🎉 <br><br>The Cardiverse: Harnessing LLMs for Novel Card Game Prototyping, a LLM-based pipeline designed to assist human designers in card game prototyping. Our work integrates game mechanic design, code generation, and gameplay AI creation into a cohesive framework. <br><br>Great collaboration with the Intelligent Visual Interfaces lab at Rutgers! Congratulations to all the authors: Danrui Li, Sen Zhang, Samuel S. Sohn, and Mubbasir Kapadia. <br><br>Link of paper: https://lnkd.in/g-Rs3iPF"
  image: Cardiverse2025.png

- date: "18 August 2025"
  headline: "We are hiring! Our lab is looking for creative, enthusiastic individuals eager to push the boundaries of crowd simulation, virtual reality, and interactive digital environments. We are generally looking for individuals with skillset in tools and platforms like Unreal Engine, Unity3D, VR/AR toolkits, 3D character modeling, motion capture, and other related technologies. If you have the background, we'd love to hear from you!"
